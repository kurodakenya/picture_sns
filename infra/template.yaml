AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Photo SNS - Serverless Backend

Globals:
  Function:
    Timeout: 10
    Runtime: nodejs20.x
    MemorySize: 256
    Environment:
      Variables:
        POSTS_TABLE: !Ref PostsTable
        LIKES_TABLE: !Ref LikesTable
        S3_BUCKET: !Ref ContentBucket
        REGION: !Ref AWS::Region

Resources:
  # ==================
  # Cognito
  # ==================
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: photo-sns-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: preferred_username
          AttributeDataType: String
          Mutable: false
          Required: false
          StringAttributeConstraints:
            MinLength: "1"
            MaxLength: "20"
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: photo-sns-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  # ==================
  # DynamoDB
  # ==================
  PostsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: photo-sns-posts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: postId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
        - AttributeName: gsiPk
          AttributeType: S
      KeySchema:
        - AttributeName: postId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: PostsByCreatedAt
          KeySchema:
            - AttributeName: gsiPk
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: PostsByUser
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  LikesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: photo-sns-likes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: postId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: postId
          KeyType: HASH
        - AttributeName: userId
          KeyType: RANGE

  # ==================
  # S3
  # ==================
  ContentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "photo-sns-content-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [PUT]
            AllowedOrigins: ["*"]
            MaxAge: 3600

  ContentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ContentBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${ContentBucket.Arn}/frontend/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/*"

  # ==================
  # API Gateway
  # ==================
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            AuthorizationScopes:
              - openid
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient

  # ==================
  # Lambda Functions
  # ==================
  PresignFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers/presign
      Handler: index.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /uploads/presign
            Method: POST
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ContentBucket

  CreatePostFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers/createPost
      Handler: index.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PostsTable

  GetFeedFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers/getFeed
      Handler: index.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /feed
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PostsTable
        - DynamoDBReadPolicy:
            TableName: !Ref LikesTable

  GetMyPostsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers/getMyPosts
      Handler: index.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me/posts
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PostsTable
        - DynamoDBReadPolicy:
            TableName: !Ref LikesTable

  DeletePostFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers/deletePost
      Handler: index.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts/{postId}
            Method: DELETE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PostsTable
        - S3CrudPolicy:
            BucketName: !Ref ContentBucket

  LikePostFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers/likePost
      Handler: index.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts/{postId}/like
            Method: PUT
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PostsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref LikesTable

  UnlikePostFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/handlers/unlikePost
      Handler: index.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /posts/{postId}/like
            Method: DELETE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PostsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref LikesTable

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
  ContentBucketName:
    Description: S3 Bucket Name
    Value: !Ref ContentBucket
